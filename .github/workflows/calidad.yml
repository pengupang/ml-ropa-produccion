name: Puerta de calidad del modelo

on:
  push:
  workflow_dispatch:
    inputs:
      modelo:
        description: "Ruta del modelo a revisar"
        default: "modelos/modelo_p65_int8.onnx"

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr la puerta de calidad
        env:
          MODELO: ${{ github.event.inputs.modelo || 'modelos/modelo_p65_int8.onnx' }}
        run: pytest tests/ -v